<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- DESIGN.md §3 tokens only: --sumi ground, --washi mark. No vermilion:
       an enclosed vermilion shape is the badge failure mode recorded in §10,
       and a favicon is the most enclosed shape there is. Georgia is the same
       metrics-matched fallback the display face uses (§4.1), so the mark keeps
       its mincho-adjacent proportions without depending on a webfont. -->
  <rect width="64" height="64" fill="#0B0A09"/>
  <text x="32" y="45"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42"
        fill="#E8E1D4"
        text-anchor="middle">N</text>
</svg>
