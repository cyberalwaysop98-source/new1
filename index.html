<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0A09" />
    <title>NOIR — 喫茶室, Tomigaya</title>
    <meta
      name="description"
      content="NOIR — a seven-seat kissaten in Tomigaya, Tokyo. Dark wood, one low light, hand-drip only."
    />

    <!--
      Open Graph / Twitter.

      og:url, og:image and twitter:image are ABSOLUTE against the live origin.
      Scrapers (Facebook, Slack, LinkedIn, X) require it and silently render no
      card for a relative URL. If the site moves to a custom domain, these three
      are the only values that must change.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOIR" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:title" content="NOIR — 喫茶室, Tomigaya" />
    <meta
      property="og:description"
      content="A seven-seat kissaten in Tomigaya, Tokyo. Dark wood, one low light, hand-drip only. No music, no wifi, no second cup."
    />
    <meta property="og:url" content="https://new1-eight-ochre.vercel.app/" />
    <meta property="og:image" content="https://new1-eight-ochre.vercel.app/og/noir-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A thin thread of coffee pouring into a glass server in a dark room." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOIR — 喫茶室, Tomigaya" />
    <meta
      name="twitter:description"
      content="A seven-seat kissaten in Tomigaya, Tokyo. Dark wood, one low light, hand-drip only."
    />
    <meta name="twitter:image" content="https://new1-eight-ochre.vercel.app/og/noir-og.jpg" />

    <!-- §4.1: self-hosted subsets. Preload the three faces used above the
         fold, since the hero title is the LCP element and must not wait on a
         font request that starts late. crossorigin is required even same-origin
         for fonts, or the preload is fetched twice. -->
    <link rel="preload" href="/fonts/shippori-mincho-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-kaku-gothic-new-300-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-kaku-gothic-new-400-subset.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Marks JS as available BEFORE first paint, so the hero's pre-animation
      masked state (styles/layout.css) applies only when GSAP will actually be
      there to animate it out. Without this the state would be authored in CSS
      unconditionally and a JS failure would leave the hero permanently hidden.
      Must stay inline and synchronous — a deferred or external script runs too
      late and reintroduces the flash it exists to prevent.
    -->
    <script>document.documentElement.classList.add('js');</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
